<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Product Factory (APF)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
        "react-dom": "https://esm.sh/react-dom@18.3.1",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
        "framer-motion": "https://esm.sh/framer-motion@11?external=react,react-dom",
        "lucide-react": "https://esm.sh/lucide-react@0.400.0?external=react,react-dom",
        "clsx": "https://esm.sh/clsx@2.1.1",
        "tailwind-merge": "https://esm.sh/tailwind-merge@2.3.0"
      }
    }
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0c0a09; color: #f5f5f4; }
        .glass { background: rgba(28, 25, 23, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(68, 64, 60, 0.5); }
        .gradient-text { background: linear-gradient(135deg, #f5f5f4 0%, #a8a29e 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" data-type="module" data-presets="react">
        import React, { useState, useEffect } from "react";
        import { createRoot } from "react-dom/client";
        import { motion, AnimatePresence } from "framer-motion";
        import { 
            Rocket, 
            Terminal, 
            ShieldAlert, 
            Cpu, 
            Layers, 
            CheckCircle2, 
            ExternalLink, 
            Plus, 
            ChevronRight,
            ArrowRight,
            Zap,
            Package,
            BarChart3
        } from "lucide-react";

        const App = () => {
            const [view, setView] = useState("landing");
            const [projects, setProjects] = useState([]);
            const [selectedProject, setSelectedProject] = useState(null);

            useEffect(() => {
                fetch("/api/projects")
                    .then(r => r.json())
                    .then(setProjects);
            }, []);

            const createProject = (name, desc) => {
                const id = Math.random().toString(36).substring(7);
                fetch("/api/projects", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ id, name, description: desc })
                }).then(() => {
                    setView("dashboard");
                    fetch("/api/projects").then(r => r.json()).then(setProjects);
                });
            };

            return (
                <div className="min-h-screen selection:bg-blue-500/30">
                    <AnimatePresence mode="wait">
                        {view === "landing" && (
                            <LandingPage key="landing" onStart={() => setView("create")} />
                        )}
                        {view === "create" && (
                            <CreateProject key="create" onSubmit={createProject} onBack={() => setView("landing")} />
                        )}
                        {view === "dashboard" && (
                            <Dashboard 
                                key="dashboard" 
                                projects={projects} 
                                onSelect={(p) => { setSelectedProject(p); setView("detail"); }}
                                onNew={() => setView("create")}
                            />
                        )}
                        {view === "detail" && (
                            <ProjectDetail 
                                key="detail" 
                                project={selectedProject} 
                                onBack={() => setView("dashboard")} 
                            />
                        )}
                    </AnimatePresence>
                </div>
            );
        };

        const LandingPage = ({ onStart }) => (
            <motion.div 
                initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}
                className="max-w-6xl mx-auto px-6 py-20"
            >
                <nav className="flex justify-between items-center mb-32">
                    <div className="flex items-center gap-2 font-bold text-xl">
                        <div className="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                            <Rocket className="w-5 h-5 text-white" />
                        </div>
                        <span>APF</span>
                    </div>
                    <button 
                        onClick={onStart}
                        className="px-5 py-2 rounded-full glass hover:bg-stone-800 transition-all text-sm font-medium"
                    >
                        Sign In
                    </button>
                </nav>

                <div className="text-center mb-24">
                    <motion.h1 
                        initial={{ y: 20, opacity: 0 }} animate={{ y: 0, opacity: 1 }}
                        className="text-6xl md:text-8xl font-bold mb-8 tracking-tight gradient-text"
                    >
                        The Publisher, <br/>Not the Author.
                    </motion.h1>
                    <motion.p 
                        initial={{ y: 20, opacity: 0 }} animate={{ y: 0, opacity: 1 }} transition={{ delay: 0.1 }}
                        className="text-xl text-stone-400 max-w-2xl mx-auto mb-12"
                    >
                        Turn any idea, repo, or unfinished project into a market-ready, sellable product in under 30 minutes.
                    </motion.p>
                    <motion.div 
                        initial={{ y: 20, opacity: 0 }} animate={{ y: 0, opacity: 1 }} transition={{ delay: 0.2 }}
                        className="flex flex-col md:flex-row items-center justify-center gap-4"
                    >
                        <button 
                            onClick={onStart}
                            className="w-full md:w-auto px-8 py-4 bg-blue-600 hover:bg-blue-500 rounded-xl font-semibold flex items-center justify-center gap-2 transition-all shadow-lg shadow-blue-900/20"
                        >
                            Start Building <ArrowRight className="w-5 h-5" />
                        </button>
                        <div className="w-full md:w-auto px-6 py-4 glass rounded-xl flex items-center gap-3 text-stone-400 font-mono text-sm">
                            <Terminal className="w-4 h-4" />
                            <span>npx apf push</span>
                        </div>
                    </motion.div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-32">
                    <FeatureCard 
                        icon={<ShieldAlert className="text-orange-500" />}
                        title="Devil’s Advocate"
                        desc="Early kill/pivot scoring to save you months of building the wrong thing."
                    />
                    <FeatureCard 
                        icon={<Layers className="text-blue-500" />}
                        title="Artifact Graph"
                        desc="Dependency-aware intelligence that keeps your strategy and code in sync."
                    />
                    <FeatureCard 
                        icon={<Cpu className="text-purple-500" />}
                        title="Tech-to-Benefit"
                        desc="Automatic translation of features into outcomes that customers pay for."
                    />
                </div>
            </motion.div>
        );

        const FeatureCard = ({ icon, title, desc }) => (
            <div className="p-8 glass rounded-2xl hover:border-stone-600 transition-all group">
                <div className="mb-4 text-2xl">{icon}</div>
                <h3 className="text-xl font-bold mb-3 group-hover:text-blue-400 transition-colors">{title}</h3>
                <p className="text-stone-400 leading-relaxed">{desc}</p>
            </div>
        );

        const CreateProject = ({ onSubmit, onBack }) => {
            const [name, setName] = useState("");
            const [desc, setDesc] = useState("");

            return (
                <motion.div 
                    initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: -20 }}
                    className="max-w-xl mx-auto px-6 pt-32"
                >
                    <button onClick={onBack} className="mb-8 text-stone-500 hover:text-stone-300 flex items-center gap-2">
                        <ArrowRight className="w-4 h-4 rotate-180" /> Back
                    </button>
                    <h2 className="text-4xl font-bold mb-8">What are you building?</h2>
                    <div className="space-y-6">
                        <div>
                            <label className="block text-sm font-medium text-stone-400 mb-2">Project Name</label>
                            <input 
                                value={name} onChange={(e) => setName(e.target.value)}
                                className="w-full p-4 glass rounded-xl outline-none focus:border-blue-500 transition-all"
                                placeholder="e.g. GhostWriter AI"
                            />
                        </div>
                        <div>
                            <label className="block text-sm font-medium text-stone-400 mb-2">Description or Repo URL</label>
                            <textarea 
                                value={desc} onChange={(e) => setDesc(e.target.value)}
                                className="w-full p-4 glass rounded-xl outline-none focus:border-blue-500 transition-all h-32"
                                placeholder="Paste your README or describe your core tech..."
                            />
                        </div>
                        <button 
                            onClick={() => onSubmit(name, desc)}
                            disabled={!name}
                            className="w-full py-4 bg-blue-600 hover:bg-blue-500 disabled:opacity-50 rounded-xl font-semibold transition-all"
                        >
                            Initialize Productization
                        </button>
                    </div>
                </motion.div>
            );
        };

        const Dashboard = ({ projects, onSelect, onNew }) => (
            <motion.div 
                initial={{ opacity: 0 }} animate={{ opacity: 1 }}
                className="max-w-6xl mx-auto px-6 py-12"
            >
                <div className="flex justify-between items-center mb-12">
                    <div>
                        <h1 className="text-3xl font-bold">Factory Floor</h1>
                        <p className="text-stone-400">Manage your product portfolio</p>
                    </div>
                    <button onClick={onNew} className="px-4 py-2 bg-blue-600 rounded-lg flex items-center gap-2 font-medium">
                        <Plus className="w-4 h-4" /> New Project
                    </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    {projects.map(p => (
                        <div 
                            key={p.id} onClick={() => onSelect(p)}
                            className="glass p-6 rounded-2xl cursor-pointer hover:border-blue-500/50 transition-all group"
                        >
                            <div className="flex justify-between items-start mb-4">
                                <div className="w-10 h-10 bg-stone-800 rounded-lg flex items-center justify-center text-blue-500">
                                    <Package className="w-5 h-5" />
                                </div>
                                <div className="px-2 py-1 bg-blue-500/10 text-blue-400 text-xs font-bold rounded uppercase tracking-wider">
                                    Score: {p.score}
                                </div>
                            </div>
                            <h3 className="text-lg font-bold mb-2 group-hover:text-blue-400">{p.name}</h3>
                            <p className="text-stone-500 text-sm line-clamp-2 mb-6">{p.description}</p>
                            <div className="flex items-center justify-between text-xs text-stone-600">
                                <div className="flex items-center gap-2">
                                    <Zap className="w-3 h-3 text-orange-500" />
                                    Active Pipeline
                                </div>
                                <span>{new Date(p.created_at).toLocaleDateString()}</span>
                            </div>
                        </div>
                    ))}
                    {projects.length === 0 && (
                        <div className="col-span-full py-20 text-center glass rounded-3xl border-dashed">
                            <BarChart3 className="w-12 h-12 text-stone-700 mx-auto mb-4" />
                            <p className="text-stone-500">No projects yet. Push your first repo.</p>
                        </div>
                    )}
                </div>
            </motion.div>
        );

        const ProjectDetail = ({ project, onBack }) => {
            const [activeTab, setActiveTab] = useState("validation");

            return (
                <motion.div 
                    initial={{ opacity: 0 }} animate={{ opacity: 1 }}
                    className="max-w-6xl mx-auto px-6 py-12"
                >
                    <button onClick={onBack} className="mb-8 text-stone-500 hover:text-stone-300 flex items-center gap-2">
                        <ArrowRight className="w-4 h-4 rotate-180" /> Dashboard
                    </button>

                    <div className="grid grid-cols-1 lg:grid-cols-4 gap-8">
                        <div className="lg:col-span-1 space-y-4">
                            <div className="glass p-6 rounded-2xl">
                                <h1 className="text-2xl font-bold mb-2">{project.name}</h1>
                                <p className="text-xs text-stone-500 uppercase font-bold tracking-widest mb-6">Product ID: {project.id}</p>
                                
                                <div className="space-y-2">
                                    {["validation", "strategy", "pricing", "assets", "launch"].map(t => (
                                        <button 
                                            key={t} onClick={() => setActiveTab(t)}
                                            className={`w-full text-left px-4 py-3 rounded-xl capitalize transition-all flex items-center justify-between ${activeTab === t ? 'bg-blue-600 text-white' : 'hover:bg-stone-800 text-stone-400'}`}
                                        >
                                            {t}
                                            {activeTab === t && <ChevronRight className="w-4 h-4" />}
                                        </button>
                                    ))}
                                </div>
                            </div>
                            
                            <div className="glass p-6 rounded-2xl">
                                <div className="flex items-center justify-between mb-4">
                                    <span className="text-sm font-medium text-stone-400">Overall Score</span>
                                    <span className="text-2xl font-bold text-blue-500">{project.score}</span>
                                </div>
                                <div className="w-full bg-stone-800 h-2 rounded-full overflow-hidden">
                                    <div className="bg-blue-500 h-full" style={{ width: `${project.score}%` }}></div>
                                </div>
                            </div>
                        </div>

                        <div className="lg:col-span-3">
                            <AnimatePresence mode="wait">
                                {activeTab === "validation" && (
                                    <motion.div 
                                        key="v" initial={{ opacity: 0, x: 10 }} animate={{ opacity: 1, x: 0 }}
                                        className="space-y-6"
                                    >
                                        <div className="glass p-8 rounded-3xl">
                                            <div className="flex items-center gap-3 mb-6 text-orange-500">
                                                <ShieldAlert className="w-6 h-6" />
                                                <h2 className="text-2xl font-bold">Devil’s Advocate Report</h2>
                                            </div>
                                            <div className="p-6 bg-orange-500/10 border border-orange-500/20 rounded-2xl mb-8">
                                                <h3 className="font-bold text-orange-400 mb-2">Verdict: High Friction</h3>
                                                <p className="text-stone-300">Your current positioning as a "general AI tool" is too broad. You are competing with ChatGPT. To win, you must pivot to a specific vertical (e.g. Legal AI for small firms).</p>
                                            </div>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                <ScoreItem label="Market Demand" score={72} />
                                                <ScoreItem label="Competition" score={24} color="text-red-500" />
                                                <ScoreItem label="Build Effort" score={85} />
                                                <ScoreItem label="Revenue Potential" score={60} />
                                            </div>
                                        </div>
                                    </motion.div>
                                )}
                                {activeTab !== "validation" && (
                                    <motion.div 
                                        key="w" initial={{ opacity: 0, x: 10 }} animate={{ opacity: 1, x: 0 }}
                                        className="flex flex-col items-center justify-center py-32 glass rounded-3xl border-dashed"
                                    >
                                        <Layers className="w-12 h-12 text-stone-700 mb-4" />
                                        <p className="text-stone-500">Artifact Generation in Progress...</p>
                                    </motion.div>
                                )}
                            </AnimatePresence>
                        </div>
                    </div>
                </motion.div>
            );
        };

        const ScoreItem = ({ label, score, color = "text-blue-500" }) => (
            <div className="p-4 bg-stone-900/50 rounded-xl border border-stone-800">
                <div className="flex justify-between items-center mb-2">
                    <span className="text-sm text-stone-500">{label}</span>
                    <span className={`font-bold ${color}`}>{score}%</span>
                </div>
                <div className="w-full bg-stone-800 h-1 rounded-full overflow-hidden">
                    <div className={`${color.replace('text', 'bg')} h-full`} style={{ width: `${score}%` }}></div>
                </div>
            </div>
        );

        createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
